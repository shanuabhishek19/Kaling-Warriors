name: Deploy Supabase Edge Functions

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "supabase/functions/**"
      - "supabase/config.toml"

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Deploy Edge Functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: snrshfqskrfsuwddmtxj
        run: |
          supabase functions deploy send-notification-email --project-ref "$SUPABASE_PROJECT_ID" --no-verify-jwt
          supabase functions deploy manage-admin --project-ref "$SUPABASE_PROJECT_ID"
